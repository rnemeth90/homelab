# Maps Keycloak group "homelab-admins" to a service account with Argo Workflows admin rights.
{{- define "argo-workflows.ssoAdmin" -}}
name: sso-admin
namespace: argo-workflows
annotations:
  workflows.argoproj.io/rbac-rule: "'homelab-admins' in groups"
  workflows.argoproj.io/rbac-rule-precedence: "10"
{{- end }}
{{ include "homelab.render" (list . "serviceAccount" "argo-workflows.ssoAdmin") }}
---
{{- define "argo-workflows.ssoAdminToken" -}}
name: sso-admin.service-account-token
namespace: argo-workflows
annotations:
  kubernetes.io/service-account.name: sso-admin
type: kubernetes.io/service-account-token
{{- end }}
{{ include "homelab.render" (list . "secret" "argo-workflows.ssoAdminToken") }}
---
{{- define "argo-workflows.ssoAdminBinding" -}}
name: argo-workflows-sso-admin
roleRef:
  name: argo-workflows-admin
subjects:
  - kind: ServiceAccount
    name: sso-admin
    namespace: argo-workflows
{{- end }}
{{ include "homelab.render" (list . "clusterRoleBinding" "argo-workflows.ssoAdminBinding") }}
