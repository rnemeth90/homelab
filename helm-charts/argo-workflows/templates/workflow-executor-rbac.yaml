# Lets workflow pods in the "argo" namespace report task results.
{{- define "argo-workflows.executorRole" -}}
name: workflow-executor
namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
{{- end }}
{{ include "homelab.render" (list . "role" "argo-workflows.executorRole") }}
---
{{- define "argo-workflows.executorBinding" -}}
name: workflow-executor
namespace: argo
subjects:
  - kind: ServiceAccount
    name: default
    namespace: argo
{{- end }}
{{ include "homelab.render" (list . "roleBinding" "argo-workflows.executorBinding") }}
