uptime-kuma:
  ingress:
    enabled: true
    className: cilium
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
    hosts:
      - host: uptime-kuma.geekyryan.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: uptime-kuma-tls
        hosts:
          - uptime-kuma.geekyryan.com

  volume:
    enabled: true
    size: 4Gi
