{{- range .Values.scope.namespaces }}
---
{{ include "homelab.namespace" (dict "root" $ "values" (dict "name" .)) }}
{{- end }}
{{- define "kubetux.enemies" -}}
{{- with .Values.arena }}
enabled: {{ .enabled }}
name: enemies
namespace: {{ .namespace }}
selectorLabels:
  app.kubernetes.io/name: enemies
replicaCount: {{ .enemies }}
terminationGracePeriodSeconds: 0
containerName: enemy
image: {{ .image }}
resources:
  requests:
    cpu: 1m
    memory: 4Mi
{{- end }}
{{- end }}
---
{{ include "homelab.render" (list . "deployment" "kubetux.enemies") }}
