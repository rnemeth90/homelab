{{- include "kubetux.validate" . }}
{{- define "kubetux.deployment" -}}
strategy:
  type: Recreate
podLabels:
  # Never let the game target itself.
  {{ .Values.scope.protectLabel }}: "true"
serviceAccountName: {{ include "homelab.fullname" . }}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
image: {{ include "kubetux.image" . | quote }}
imagePullPolicy: {{ .Values.image.pullPolicy }}
args:
  - --ui={{ .Values.ui }}
  - --dry-run={{ .Values.dryRun }}
  - --max-enemies={{ .Values.maxEnemies }}
  - --kill-interval={{ .Values.killInterval }}
env:
  - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
  - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
  - {name: KUBETUX_NAMESPACES, value: {{ join "," .Values.scope.namespaces | quote }}}
  - {name: KUBETUX_EXCLUDE_NAMESPACES, value: {{ join "," .Values.scope.excludeNamespaces | quote }}}
  - {name: KUBETUX_SELECTOR, value: {{ .Values.scope.selector | quote }}}
  - {name: KUBETUX_PROTECT_LABEL, value: {{ .Values.scope.protectLabel | quote }}}
  {{- if and (eq .Values.ui "vnc") (or .Values.vncPassword .Values.existingSecret) }}
  - name: KUBETUX_VNC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ include "kubetux.secretName" . }}
        key: vnc-password
  {{- end }}
ports:
  - {name: game, containerPort: 6080}
  - {name: scores, containerPort: 8081}
readinessProbe:
  httpGet: {path: /healthz, port: scores}
livenessProbe:
  httpGet: {path: /healthz, port: scores}
  initialDelaySeconds: 20
resources: {{- include "kubetux.resources" . | nindent 2 }}
securityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: [ALL]}
volumeMounts:
  - {name: data, mountPath: /data}
  - {name: tmp, mountPath: /tmp}
volumes:
  - name: data
    {{- if .Values.persistence.enabled }}
    persistentVolumeClaim:
      claimName: {{ include "homelab.fullname" . }}-data
    {{- else }}
    emptyDir: {}
    {{- end }}
  - name: tmp
    emptyDir: {}
{{- with .Values.nodeSelector }}
nodeSelector: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.tolerations }}
tolerations: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.affinity }}
affinity: {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{ include "homelab.render" (list . "deployment" "kubetux.deployment") }}
