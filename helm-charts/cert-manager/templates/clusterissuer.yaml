{{- define "cert-manager.letsencrypt" -}}
name: letsencrypt-cloudflare-{{ .env }}
annotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  argocd.argoproj.io/sync-wave: "10"
acme:
  email: {{ .root.Values.clusterIssuer.email | quote }}
  server: {{ .server }}
  solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: {{ .root.Values.clusterIssuer.secretName }}
            key: api-token
{{- end }}
{{- if .Values.clusterIssuer.enabled }}
{{- $prod := include "cert-manager.letsencrypt" (dict "root" . "env" "prod" "server" "https://acme-v02.api.letsencrypt.org/directory") | fromYaml }}
{{ include "homelab.clusterIssuer" (dict "root" . "values" $prod) }}
{{- if .Values.clusterIssuer.staging }}
---
{{- $staging := include "cert-manager.letsencrypt" (dict "root" . "env" "staging" "server" "https://acme-staging-v02.api.letsencrypt.org/directory") | fromYaml }}
{{ include "homelab.clusterIssuer" (dict "root" . "values" $staging) }}
{{- end }}
{{- end }}
