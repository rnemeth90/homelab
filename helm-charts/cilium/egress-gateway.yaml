apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: egress-gateway-worker
spec:
  selectors:
  - podSelector:
      matchLabels:
        io.kubernetes.pod.namespace: default
        use-egress: "true"
  destinationCIDRs:
  - "0.0.0.0/0"
  - "::/0"
  egressGateway:
    nodeSelector:
      matchLabels:
        node.kubernetes.io/name: worker02
    egressIP: 192.168.86.22

 
