{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "snake.fullname" . }}
  labels:
    {{- include "snake.labels" . | nindent 4 }}
  {{- if or .Values.gateway.clusterIssuer .Values.gateway.annotations }}
  annotations:
    {{- if .Values.gateway.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.gateway.clusterIssuer }}
    {{- end }}
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
{{- end }}
