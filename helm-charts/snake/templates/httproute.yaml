{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "snake.fullname" . }}
  labels:
    {{- include "snake.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "snake.fullname" . }}
  hostnames:
    {{- toYaml .Values.gateway.route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.route.pathType }}
            value: {{ .Values.gateway.route.path }}
      backendRefs:
        - name: {{ include "snake.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
