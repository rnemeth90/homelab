nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: aschil/snake
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 512Mi

ingress:
  enabled: false
  ingressClassName: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
  host: snake.geekyryan.com
  path: /
  pathType: Prefix
  tls:
    secretName: snake-tls

gateway:
  enabled: true
  gatewayClassName: cilium
  clusterIssuer: letsencrypt-cloudflare-prod
  annotations: {}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: snake.geekyryan.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: snake-tls
      allowedRoutes:
        namespaces:
          from: Same
  route:
    hostnames:
      - snake.geekyryan.com
    path: /
    pathType: PathPrefix
