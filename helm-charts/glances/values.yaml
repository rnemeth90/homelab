replicaCount: 1

image:
  repository: nicolargo/glances
  tag: latest-full
  pullPolicy: IfNotPresent

# Enables the Glances web UI (served on containerPort below) instead of the
# terminal UI.
glancesOpt: "-w"

containerPort: 61208

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

ingress:
  enabled: true
  ingressClassName: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
  host: glances.geekyryan.com
  path: /
  pathType: Prefix
  tls:
    secretName: glances-tls

# By default Glances only reports on the resources of its own pod/container.
# Enable hostMounts (and consider running as a DaemonSet in a future
# iteration) to give it visibility into the underlying node instead.
hostMounts:
  enabled: false
  securityContext:
    privileged: true
  volumeMounts:
    - name: proc
      mountPath: /host/proc
      readOnly: true
    - name: sys
      mountPath: /host/sys
      readOnly: true
    - name: docker-sock
      mountPath: /var/run/docker.sock
  volumes:
    - name: proc
      hostPath:
        path: /proc
    - name: sys
      hostPath:
        path: /sys
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
