apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bind9.fullname" . }}-config
  labels:
    {{- include "bind9.labels" . | nindent 4 }}
data:
  named.conf: |-
{{ .Values.config.namedConf | indent 4 }}
{{- range $name, $content := .Values.config.zoneFiles }}
  {{ $name }}: |
{{ $content | indent 4 }}
{{- end }}
