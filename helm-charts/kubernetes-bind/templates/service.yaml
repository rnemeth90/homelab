{{- define "bind9.service" -}}
selectorLabels:
  app: bind9
ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: UDP
    name: dns-udp
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
    name: dns-tcp
{{- end }}
{{ include "homelab.render" (list . "service" "bind9.service" .Values.service) }}
