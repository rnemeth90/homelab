{{- define "bind9.deployment" -}}
selectorLabels:
  app: bind9
podAnnotations:
  # Restart when the DNS config changes (hashes the values, not the rendered
  # ConfigMap, so label-only changes such as chart bumps do not roll the pod).
  checksum/config: {{ toYaml .Values.config | sha256sum }}
podSecurityContext:
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
ports:
  - containerPort: 53
    protocol: UDP
  - containerPort: 53
    protocol: TCP
volumeMounts:
  - name: config-volume
    mountPath: /etc/bind
  {{- if .Values.persistence.enabled }}
  - name: data-volume
    mountPath: /var/cache/bind
  {{- end }}
volumes:
  - name: config-volume
    configMap:
      name: {{ include "homelab.fullname" . }}-config
  {{- if .Values.persistence.enabled }}
  - name: data-volume
    persistentVolumeClaim:
      claimName: {{ include "homelab.fullname" . }}-pvc
  {{- end }}
{{- end }}
{{ include "homelab.render" (list . "deployment" "bind9.deployment" .Values) }}
