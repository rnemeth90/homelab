external-dns:
  provider:
    name: pihole
  sources:
    - ingress
  # Pi-hole's Custom DNS has no TXT support, so ownership can't be tracked.
  # upsert-only keeps hand-managed records from being deleted.
  registry: noop
  policy: upsert-only
  domainFilters:
    - geekyryan.com
  extraArgs:
    - --pihole-server=http://192.168.86.5
  # Must be created manually (not committed to git):
  #   kubectl -n external-dns create secret generic pihole-password \
  #     --from-literal=EXTERNAL_DNS_PIHOLE_PASSWORD='<pihole web password>'
  env:
    - name: EXTERNAL_DNS_PIHOLE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pihole-password
          key: EXTERNAL_DNS_PIHOLE_PASSWORD
