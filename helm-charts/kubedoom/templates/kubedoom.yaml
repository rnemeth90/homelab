apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedoom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubedoom
  labels:
    app.kubernetes.io/name: kubedoom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubedoom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubedoom
    spec:
      serviceAccountName: kubedoom
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: kubedoom
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NAMESPACE
              value: {{ .Values.arena.namespace | quote }}
          ports:
            - name: vnc
              containerPort: 5900
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kubedoom
  labels:
    app.kubernetes.io/name: kubedoom
  {{- if .Values.service.loadBalancerIP }}
  annotations:
    lbipam.cilium.io/ips: {{ .Values.service.loadBalancerIP | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: vnc
      port: {{ .Values.service.port }}
      targetPort: vnc
      protocol: TCP
  selector:
    app.kubernetes.io/name: kubedoom
