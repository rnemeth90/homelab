{{ include "homelab.serviceAccount" (dict "root" . "values" (dict)) }}
---
{{- define "kubedoom.deployment" -}}
serviceAccountName: {{ include "homelab.fullname" . }}
env:
  - name: NAMESPACE
    value: {{ .Values.arena.namespace | quote }}
ports:
  - name: vnc
    containerPort: 5900
    protocol: TCP
{{- end }}
{{ include "homelab.render" (list . "deployment" "kubedoom.deployment" .Values) }}
---
{{ include "homelab.render" (list . "service" "" (merge (dict "portName" "vnc" "targetPort" "vnc") .Values.service)) }}
