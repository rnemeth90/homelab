{{ include "homelab.namespace" (dict "root" . "values" (dict "name" .Values.arena.namespace)) }}
---
{{- define "kubedoom.monsters" -}}
name: monsters
namespace: {{ .Values.arena.namespace }}
selectorLabels:
  app.kubernetes.io/name: monsters
replicaCount: {{ .Values.arena.monsters }}
terminationGracePeriodSeconds: 0
containerName: monster
image: {{ .Values.arena.image }}
resources:
  requests:
    cpu: 1m
    memory: 4Mi
{{- end }}
{{ include "homelab.render" (list . "deployment" "kubedoom.monsters") }}
---
{{- define "kubedoom.arenaRole" -}}
namespace: {{ .Values.arena.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
{{- end }}
{{ include "homelab.render" (list . "role" "kubedoom.arenaRole") }}
---
{{ include "homelab.roleBinding" (dict "root" . "values" (dict "namespace" .Values.arena.namespace)) }}
