apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.arena.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monsters
  namespace: {{ .Values.arena.namespace }}
  labels:
    app.kubernetes.io/name: monsters
spec:
  replicas: {{ .Values.arena.monsters }}
  selector:
    matchLabels:
      app.kubernetes.io/name: monsters
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monsters
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: monster
          image: {{ .Values.arena.image }}
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedoom
  namespace: {{ .Values.arena.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedoom
  namespace: {{ .Values.arena.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubedoom
subjects:
  - kind: ServiceAccount
    name: kubedoom
    namespace: {{ .Release.Namespace }}
