{{- define "keycloak.postgresService" -}}
name: keycloak-postgres
selectorLabels:
  app: keycloak-postgres
ports:
  - port: 5432
    name: postgres
{{- end }}
{{ include "homelab.render" (list . "service" "keycloak.postgresService") }}
---
{{- define "keycloak.postgres" -}}
name: keycloak-postgres
selectorLabels:
  app: keycloak-postgres
containerName: postgres
image: {{ .Values.postgres.image }}
ports:
  - containerPort: 5432
    name: postgres
env:
  - name: POSTGRES_DB
    value: {{ .Values.postgres.database | quote }}
  - name: POSTGRES_USER
    value: {{ .Values.postgres.username | quote }}
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: {{ .Values.postgres.existingSecret }}
        key: password
  # Data lives in a subdirectory because the volume root can contain lost+found.
  - name: PGDATA
    value: /var/lib/postgresql/data/pgdata
readinessProbe:
  exec:
    command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
  periodSeconds: 5
volumeMounts:
  - name: data
    mountPath: /var/lib/postgresql/data
resources:
  requests:
    cpu: 100m
    memory: 256Mi
volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: keycloak-local
      resources:
        requests:
          storage: {{ .Values.postgres.storage }}
{{- end }}
{{ include "homelab.render" (list . "statefulset" "keycloak.postgres") }}
