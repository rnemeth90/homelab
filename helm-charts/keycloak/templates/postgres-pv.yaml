# Postgres needs a real filesystem (NFS root-squash breaks its ownership checks),
# so the database lives on worker02's local disk (same approach as harbor).
{{- define "keycloak.postgresPV" -}}
name: keycloak-postgres-local
size: {{ .Values.postgres.storage }}
storageClassName: keycloak-local
hostPath:
  path: /var/lib/keycloak-postgres
  type: DirectoryOrCreate
node: worker02
{{- end }}
{{ include "homelab.render" (list . "persistentVolume" "keycloak.postgresPV") }}
