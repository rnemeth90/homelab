qdrant:
  # The NFS export squashes root, so the init chown is not permitted.
  updateVolumeFsOwnership: false
  ingress:
    enabled: true
    ingressClassName: cilium
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
    hosts:
      - host: qdrant.geekyryan.com
        paths:
          - path: /
            pathType: Prefix
            servicePort: 6333
    tls:
      - secretName: qdrant-tls
        hosts:
          - qdrant.geekyryan.com
