- name: Deploy MetalLB
  hosts: masters
  become: yes
  tasks:
    - name: Install MetalLB
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/metallb/metallb/{{ metallb_version }}/config/manifests/metallb-native.yaml --kubeconfig={{ kubeconfig_path }}
      args:
        executable: /bin/bash

- name: Configure MetalLB Address Pool and L2 Advertisement
  hosts: masters
  become: yes
  tasks:
    - name: Apply MetalLB IPAddressPool and L2Advertisement using kubectl
      shell: |
        cat <<EOF | KUBECONFIG={{ kubeconfig_path }} kubectl apply -f -
        apiVersion: metallb.io/v1beta1
        kind: IPAddressPool
        metadata:
          name: default-pool
          namespace: metallb-system
        spec:
          addresses:
          - {{ metallb_ip_range }}
        ---
        apiVersion: metallb.io/v1beta1
        kind: L2Advertisement
        metadata:
          name: l2adv
          namespace: metallb-system
        EOF
      args:
        executable: /bin/bash

