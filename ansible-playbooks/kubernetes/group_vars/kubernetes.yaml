common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - chrony
  - firewalld
  - nfs-common

kubernetes_packages:
  - kubelet=1.32.*
  - kubeadm=1.32.*
  - kubectl=1.32.*

containerd_config_file: /etc/containerd/config.toml
kubernetes_keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
kubernetes_repo: "https://pkgs.k8s.io/core:/stable:/v1.32/deb/"
kubelet_config_file: /etc/systemd/system/kubelet.service.d/10-kubeadm.conf
dns_domain_name: "geekyryan.lan"
pod_network_cidr: 10.32.0.0/16
# Cilium cluster-pool IPAM range (cluster-pool-ipv4-cidr in cilium-config)
cilium_pod_cidr: 10.0.0.0/16
cluster_admin_username: rtn

# HA control plane (06-ha-control-plane.yaml)
kube_api_vip: 192.168.86.48
kube_vip_version: v1.3.1
kube_api_cert_sans:
  - "{{ kube_api_vip }}"
  - k8s-api.geekyryan.com
  - k8s-api.geekyryan.lan

custom_dns_servers:
- 192.168.86.5

kubernetes_audit_log_path: /var/log/kubernetes/audit.log
container_log_rotate_size: 100M
container_log_rotate_count: 5

fail2ban_ignore_cidr: 192.168.86.0/24
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5

dphys_swapfile_path: /var/swap

