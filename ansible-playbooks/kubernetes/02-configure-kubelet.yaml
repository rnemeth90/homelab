- name: Configure kubelet to use containerd
  hosts: kubernetes
  become: yes
  tasks:
    - name: Ensure kubelet config directory exists
      file:
        path: /var/lib/kubelet
        state: directory
        mode: '0755'

    - name: Modify kubelet config to use containerd
      lineinfile:
        path: /var/lib/kubelet/config.yaml
        regexp: '^containerRuntimeEndpoint:'
        line: 'containerRuntimeEndpoint: "unix:///run/containerd/containerd.sock"'
        create: yes
      notify: Restart kubelet

    - name: Ensure kubelet is started and enabled
      systemd:
        name: kubelet
        state: started
        enabled: yes

  handlers:
    - name: Restart kubelet
      systemd:
        name: kubelet
        state: restarted
