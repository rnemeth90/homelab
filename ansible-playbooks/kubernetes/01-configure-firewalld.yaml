- name: Configure firewalld for Kubernetes
  hosts: kubernetes
  become: yes
  tasks:
    - name: Ensure firewalld is installed
      package:
        name: firewalld
        state: present

    - name: Start and enable firewalld
      service:
        name: firewalld
        state: started
        enabled: yes

    - name: Enabling masquerade
      firewalld:
        masquerade: true
        state: enabled
        permanent: true

    - name: Open ports for Kubernetes control plane
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 6443/tcp
        - 2379-2380/tcp
        - 10250/tcp
        - 10251/tcp
        - 10252/tcp
        - 10257/tcp
        - 10259/tcp
        - 6783/udp
        - 6783/tcp
        - 8285/udp
        - 8472/udp 
        - 30000-32767/tcp
      when: "'masters' in group_names"

    - name: Open ports for Kubernetes worker nodes
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 10250/tcp
        - 8285/udp
        - 6783/udp
        - 6783/tcp
        - 8472/udp 
        - 30000-32767/tcp
      when: "'workers' in group_names"

    - name: Open ports for Cilium (health, VXLAN, Hubble, metrics)
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 4240/tcp        # cilium-health
        - 8472/udp        # VXLAN overlay
        - 4244/tcp        # Hubble server
        - 4245/tcp        # Hubble relay
        - 9890/tcp        # cilium-agent metrics
        - 9962/tcp        # cilium-agent prometheus
        - 9963/tcp        # cilium-operator prometheus
        - 9964/tcp        # cilium-envoy metrics
        - 9965/tcp        # Hubble metrics

    - name: Allow ESP (IP protocol 50) for Cilium IPsec encryption
      firewalld:
        rich_rule: rule protocol value="esp" accept
        permanent: yes
        state: enabled
        immediate: yes

    - name: Trust the Cilium pod CIDR (pod-to-host and forwarded pod traffic)
      firewalld:
        source: "{{ cilium_pod_cidr }}"
        zone: trusted
        permanent: yes
        state: enabled
        immediate: yes

    - name: Reload firewalld to apply changes
      systemd:
        name: firewalld
        state: reloaded
