- name: Configure Proxmox VE apt repositories and upgrade
  hosts: proxmox
  become: true
  tasks:
    - name: Find enterprise repo files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns:
          - "pve-enterprise.*"
          - "ceph.*"
      register: enterprise_repos
      when: proxmox_use_no_subscription_repo

    - name: Remove enterprise repos (require a subscription)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ enterprise_repos.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: proxmox_use_no_subscription_repo

    - name: Add pve-no-subscription repo
      ansible.builtin.deb822_repository:
        name: pve-no-subscription
        types: deb
        uris: http://download.proxmox.com/debian/pve
        suites: "{{ ansible_distribution_release }}"
        components: pve-no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
        state: present
      when: proxmox_use_no_subscription_repo

    - name: Upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      register: apt_upgrade

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
      when: reboot_required.stat.exists
